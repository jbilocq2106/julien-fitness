<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTEAM — Ma journée</title><style>body{font:16px system-ui;background:#111928;color:#f5f7fb;margin:0;padding:18px;max-width:850px}a{color:#ffbd83}.card{background:#24344b;border-radius:14px;padding:15px;margin:12px 0}input,textarea,select,button{font:inherit;padding:11px;border-radius:9px;margin:5px 0;background:#35465e;color:white;border:1px solid #66768d;max-width:100%}textarea{width:95%;min-height:65px}button{background:#b85623}label{display:block;margin-top:10px}small{color:#c9d1df}.done{text-decoration:line-through;opacity:.65}</style><a href="./">← Accueil MyTEAM</a><h1>Ma journée</h1><p><small>Journal local sur cet appareil. Les dictées ChatGPT ne sont pas synchronisées automatiquement. Sauvegarde/export conseillé.</small></p><label>Date <input id="date" type="date"></label><section class="card"><h2>Ajouter un déplacement</h2><label>Poste <input id="poste" placeholder="E84"></label><label>Agents présents <input id="agents" placeholder="Noms"></label><label>Intervention <select id="type"><option>Simple passage</option><option>Visite sur poste</option></select></label><label>Notes <textarea id="notes"></textarea></label><button onclick="addVisit()">Ajouter au journal</button></section><h2>Postes du jour</h2><div id="visits"></div><section class="card"><h2>Rappels à suivre</h2><input id="reminder" placeholder="Nouvelle action à faire"><button onclick="addReminder()">Ajouter</button><div id="reminders"></div></section><button onclick="exportDay()">Exporter la journée (JSON)</button><h2>Archives</h2><div id="archives"></div><script>
const key='myteam-daily-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};if(!data['2026-11-03'])data['2026-11-03']={visits:[['E14','','Simple passage','Passage déclaré, détails à compléter'],['E50','Garcia','Simple passage','Garcia rencontrée'],['E84','Henrat, Sandstrom, Marignal','Consignes vérifiées et validées','Consignes OK ; rappel à Marignal sur les arrivées tardives'],['E111','Diels, Scarpino','Visite sur poste','Diels contrôlé ; consignes non demandées ; aucun rapport signé'],['E112','','Simple passage','Détails à compléter'],['E85','','Simple passage','Détails à compléter'],['E30','','Simple passage','Détails à compléter']].map((x,i)=>({id:i+1,poste:x[0],agents:x[1],type:x[2],notes:x[3]})),reminders:[{text:'Récupérer le numéro de téléphone de Marignal',done:false},{text:'04/11 06:15 : vérifier avec Micka le changement de D’Aversi (refresh 13–14 h, E85 à 14 h), non confirmé',done:false},{text:'Vérifier les congés de Jérémy Burg et la confirmation MyGesper',done:false},{text:'Vérifier au plus tard le 15/11 la situation PIF de Scarpino en fin de mois (exemption)',done:false},{text:'Vérifier les heures de Kilian du 01/11 : 8 h effectuées, 4 h pointées',done:false}]};const date=document.getElementById('date');date.value=new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(key,JSON.stringify(data))}function day(){return data[date.value]||(data[date.value]={visits:[],reminders:[]})}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let d=day();document.getElementById('visits').innerHTML=[14,32,50,51,52,84,85,111,112,121].map(n=>{const entries=d.visits.map((v,i)=>({...v,i})).filter(v=>Number(String(v.poste).replace(/\\D/g,''))===n);return '<div class="card"><b>E'+n+'</b> — '+(entries.length?entries.length+' intervention(s)':'Non visité')+entries.map(v=>'<p><strong>'+esc(v.type)+'</strong> · '+esc(v.agents)+'<br><small>'+esc(v.notes)+'</small><br><button onclick="removeVisit('+v.i+')">Supprimer</button></p>').join('')+'</div>'}).join('');document.getElementById('reminders').innerHTML=d.reminders.map((r,i)=>'<p class="'+(r.done?'done':'')+'"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggleReminder('+i+')"> '+esc(r.text)+'</p>').join('');document.getElementById('archives').innerHTML=Object.keys(data).sort().reverse().map(k=>'<p><button onclick="date.value=\''+k+'\';render()">'+k+'</button> '+data[k].visits.length+' déplacements</p>').join('');save()}function addVisit(){day().visits.push({poste:poste.value,agents:agents.value,type:type.value,notes:notes.value});poste.value=agents.value=notes.value='';render()}function removeVisit(i){if(confirm('Supprimer ce déplacement ?')){day().visits.splice(i,1);render()}}function addReminder(){if(reminder.value.trim()){day().reminders.push({text:reminder.value.trim(),done:false});reminder.value='';render()}}function toggleReminder(i){day().reminders[i].done=!day().reminders[i].done;render()}function exportDay(){let b=new Blob([JSON.stringify({date:date.value,...day()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='myteam-'+date.value+'.json';a.click();URL.revokeObjectURL(a.href)}date.onchange=render;render();
</script></html>
