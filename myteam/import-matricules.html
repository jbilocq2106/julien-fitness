<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTEAM — Import matricules</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#111928;color:#f4f7fc;font:16px system-ui}main{max-width:620px;margin:auto}a{color:#a9ceff}section{background:#223249;border-radius:18px;padding:22px;margin-top:20px}h1{font-size:25px}p{line-height:1.6;color:#d1dbe8}input{width:100%;font:inherit;padding:16px;background:#344862;color:white;border:1px solid #8da4c0;border-radius:12px}button{width:100%;padding:17px;border:0;border-radius:12px;background:#e8792e;color:white;font-weight:750;font-size:17px;margin-top:20px}button:disabled{opacity:.4}#results{white-space:pre-wrap;line-height:1.8}details{margin-top:20px}summary{padding:12px;cursor:pointer}</style></head><body><main><a href="./">← Retour à MyTEAM</a><section><h1>Importer les matricules manquants</h1><p>Une seule opération. Les fiches et matricules existants sont conservés. Les conflits ne sont jamais remplacés automatiquement.</p><label for="file">1. Choisir mon annuaire</label><input id="file" type="file" accept=".json,application/json"><p id="filename">Aucun fichier choisi</p><div id="preview" hidden><h2>2. Vérifier le résultat</h2><p id="counts"></p><details><summary>Afficher les noms à vérifier</summary><div id="issues"></div></details><button id="confirm" type="button">Confirmer les matricules manquants</button></div><p id="results" role="status"></p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='myteam_agent_profiles_v1',deletedKey='myteam_deleted_agents_v1';let rows=null;const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');function get(){const v=JSON.parse(localStorage.getItem(key)||'{}');if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Annuaire local invalide');return v}function evaluate(data,p){const names=Object.keys(p),deletedRaw=JSON.parse(localStorage.getItem(deletedKey)||'[]'),deleted=new Set((Array.isArray(deletedRaw)?deletedRaw:[]).map(norm)),lookup=new Map();for(const name of names){const n=norm(name);lookup.set(n,lookup.has(n)?null:name)}const result={add:[],same:[],missing:[],conflict:[]},seen=new Set();for(const x of data){if(!x||typeof x.name!=='string')continue;const n=norm(x.name),num=String(x.workerNumber??x.matricule??'').trim();if(!n||!/^[0-9]{1,20}$/.test(num)||seen.has(n))continue;seen.add(n);let name=lookup.get(n);if(!name){const possible=names.filter(k=>norm(k).startsWith(n)||n.startsWith(norm(k)));if(possible.length===1)name=possible[0]}if(!name||deleted.has(norm(name))){result.missing.push(x.name);continue}const old=String(p[name]?.workerNumber||'').trim();if(old===num)result.same.push(name);else if(old)result.conflict.push(name+' : '+old+' / '+num);else result.add.push({name,num})}return result}
$('file').onchange=async()=>{rows=null;$('preview').hidden=true;$('results').textContent='';const f=$('file').files?.[0];$('filename').textContent=f?'Fichier : '+f.name:'Aucun fichier choisi';if(!f)return;try{if(f.size>500000)throw Error('Fichier trop volumineux');const data=JSON.parse(await f.text());if(!Array.isArray(data.agents))throw Error('Format invalide : liste agents absente');rows=data.agents;const r=evaluate(rows,get());$('counts').textContent=r.add.length+' à ajouter · '+r.same.length+' déjà présents · '+r.missing.length+' noms à vérifier · '+r.conflict.length+' conflits';$('issues').textContent=[...r.missing.map(n=>'Non reconnu : '+n),...r.conflict.map(n=>'Conflit : '+n)].join('\n')||'Aucun problème';$('confirm').disabled=!r.add.length;$('preview').hidden=false;if(!r.add.length)$('results').textContent='Aucun matricule manquant reconnu.'}catch(e){$('results').textContent='Erreur : '+e.message}};
$('confirm').onclick=()=>{if(!rows)return;try{const p=get(),r=evaluate(rows,p);for(const x of r.add)p[x.name]={...p[x.name],workerNumber:x.num};if(r.add.length)localStorage.setItem(key,JSON.stringify(p));$('results').textContent='Import terminé : '+r.add.length+' matricules ajoutés, '+r.same.length+' déjà présents, '+r.missing.length+' noms à vérifier, '+r.conflict.length+' conflits conservés.';$('preview').hidden=true;rows=null;$('file').value=''}catch(e){$('results').textContent='Erreur : '+e.message}}})();
</script></body></html>
