<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyTEAM — Ma journée</title><style>body{font:16px system-ui;background:#111928;color:#f5f7fb;margin:0;padding:18px;max-width:850px}a{color:#ffbd83}.card{background:#24344b;border-radius:14px;padding:15px;margin:12px 0}input,textarea,select,button{font:inherit;padding:11px;border-radius:9px;margin:5px 0;background:#35465e;color:white;border:1px solid #66768d;max-width:100%}textarea{width:95%;min-height:65px}button{background:#b85623}label{display:block;margin-top:10px}small{color:#c9d1df}.done{text-decoration:line-through;opacity:.65} .suggestions{max-height:190px;overflow:auto}.suggestions button{display:block;width:100%;text-align:left;background:#435776}.chips span{display:inline-block;padding:6px;background:#375f63;border-radius:8px;margin:3px}</style><a href="./">← Accueil MyTEAM</a><h1>Ma journée</h1><p><small>Journal local sur cet appareil. Les dictées ChatGPT ne sont pas synchronisées automatiquement. Sauvegarde/export conseillé.</small></p><label>Date <input id="date" type="date"></label><section class="card"><h2>🎙️ Dicter une visite</h2><button type="button" onclick="startDictation()">🎙️ Commencer la dictée</button><p id="voice-status">Dicte le poste, les agents et le type de passage.</p><textarea id="voice-text" placeholder="Ex. E84, Henrat et Sandstrom, visite sur poste, consignes OK"></textarea><button type="button" onclick="saveDictation()">Classer la dictée</button></section><section class="card"><h2>Ajouter un déplacement</h2><label>Poste <input id="poste" placeholder="E84"></label><label>Agents présents <input id="agents" placeholder="Noms"></label><label>Intervention <select id="type"><option>Simple passage</option><option>Visite sur poste</option></select></label><label>Notes <textarea id="notes"></textarea></label><button onclick="addVisit()">Ajouter au journal</button></section><h2>Postes du jour</h2><div id="visits"></div><section class="card"><h2>Rappels à suivre</h2><input id="reminder" placeholder="Nouvelle action à faire"><button onclick="addReminder()">Ajouter</button><div id="reminders"></div></section><button onclick="exportDay()">Exporter la journée (JSON)</button><h2>Archives</h2><div id="archives"></div><script>const FALLBACK_AGENT_NAMES=["ADAM Manon","ALI VELOU","ANTONIOL Christophe","BEHARI","BERAUT Geoffrey","BERNARD Noelya","BIGONI-HOUDUSSE Alexandre","BILOCQ Julien","BODEVING Patrick","BORGESE Myriam","BRIDELANCE Damien","BURG Jeremy","CAIROL","CHOUMAKER","CLAREN","CLESEUR Noah","COLLELA","DA ROCHA","DA SILVA MARTINS","DACHOUFF Michael","DAL FARRA Shirley","DIELS Elisa","DORRION Albert","DOS SANTOS MARTINS Anabela","DOSIL","DURAND","DURLI","EL GAMAH","F","FELTEN Laurent","FINCK Carole","FRANCESCHINI","FRANGIAMORE","FREZAL Joey","FRIESS SCHAEFFER Killian","FROSIO","FROUSSART Lucas","GAGNANT Deborah","GARCIA Maeva","GARRABI Omar","GIANOLI","GUFFROY","GUGLIETTI","HANCE Clotilde","HAUDIQUET","HENRAT Corentin","HILT Killian","HOFFART","HUMMEL Aurelien","JACOTEZ Tim","JACQUINET Thomas","JULIA Melissa","KARASU Laetitia","KERGOAT Maxime","KESSLER Jordan","KIRSCHTETTER Teddy","KIZILDAG","KRIEG","LALLOZ Steven","LEBRUN Celine","LECLERE","LUCK Océane","MAILLOT Jean Gabriel Axel","MALAINHO","MALICK","MARGINALE Marie-Joseph","MARIE","MARINI Katia","MATEI Vitor","MIANO Marie","MIGNOT Auriane","MOLTER","MOUDEBER Ryan","MOURER","MOURON","MUNIER Eva","NETO","OUINNE Melyse","PANATO Joey","PILLA","REHAMNIA","RODRIGUEZ Mathias","SANDSTROM Mike","SAUTEZ Jerome","SCARPINO Loic","SCHMID Sebastien","SEBRIER Kevin","SERJANTU Andrian","STASIAK Valentin","TERRIEN","THIBAUD","TRIPODI Adrien","TUMMINELLI Attilio","VALENTINI","VERDIN Romain","VIEL","VILLI","WEISSE","WILLEMS Jeremy","WILTGEN Ophélie","YOVE Rénaldo"];
const key='myteam-daily-v1';function agentNames(){const names=new Set(FALLBACK_AGENT_NAMES);try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!/(agent|team|roster)/i.test(key))continue;const raw=localStorage.getItem(key);if(!raw||raw.length>1500000)continue;const parsed=JSON.parse(raw);const scan=(v,depth=0)=>{if(depth>4||!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(x=>scan(x,depth+1));return}if(typeof v.name==='string'&&v.name.trim().length>2)names.add(v.name.trim());for(const [k,x] of Object.entries(v)){if(depth<=2&&typeof x==='object')scan(x,depth+1);if(depth<=2&&typeof x==='object'&&!Array.isArray(v)&&/^[A-ZÀ-ÿ][A-Za-zÀ-ÿ '\-]{3,}$/.test(k))names.add(k)}};scan(parsed)}}catch(e){}return [...names].sort((a,b)=>a.localeCompare(b,'fr'))}let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};if(!data['2026-11-03'])data['2026-11-03']={visits:[['E14','','Simple passage','Passage déclaré, détails à compléter'],['E50','Garcia','Simple passage','Garcia rencontrée'],['E84','Henrat, Sandstrom, Marignal','Consignes vérifiées et validées','Consignes OK ; rappel à Marignal sur les arrivées tardives'],['E111','Diels, Scarpino','Visite sur poste','Diels contrôlé ; consignes non demandées ; aucun rapport signé'],['E112','','Simple passage','Détails à compléter'],['E85','','Simple passage','Détails à compléter'],['E30','','Simple passage','Détails à compléter']].map((x,i)=>({id:i+1,poste:x[0],agents:x[1],type:x[2],notes:x[3]})),reminders:[{text:'Récupérer le numéro de téléphone de Marignal',done:false},{text:'04/11 06:15 : vérifier avec Micka le changement de D’Aversi (refresh 13–14 h, E85 à 14 h), non confirmé',done:false},{text:'Vérifier les congés de Jérémy Burg et la confirmation MyGesper',done:false},{text:'Vérifier au plus tard le 15/11 la situation PIF de Scarpino en fin de mois (exemption)',done:false},{text:'Vérifier les heures de Kilian du 01/11 : 8 h effectuées, 4 h pointées',done:false}]};const date=document.getElementById('date');date.value=new Date().toLocaleDateString('en-CA');function save(){localStorage.setItem(key,JSON.stringify(data))}function day(){return data[date.value]||(data[date.value]={visits:[],reminders:[]})}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let d=day();document.getElementById('visits').innerHTML=[14,32,50,51,52,84,85,111,112,121].map(n=>{const entries=d.visits.map((v,i)=>({...v,i})).filter(v=>Number(String(v.poste).replace(/[^0-9]/g,''))===n);return '<div class="card"><b>E'+n+'</b> — '+(entries.length?entries.length+' intervention(s)':'Non visité')+entries.map(v=>'<p><strong>'+esc(v.type)+'</strong> · '+esc(v.agents)+'<br><small>'+esc(v.notes)+'</small><br><button onclick="removeVisit('+v.i+')">Supprimer</button></p>').join('')+'<label>Agents <input id="agents-'+n+'" placeholder="Tape le début du nom" oninput="suggestAgents('+n+')" autocomplete="off"></label><div id="suggest-'+n+'" class="suggestions"></div><div id="selected-'+n+'" class="chips"></div>'<label>Type de passage <select id="type-'+n+'"><option>Simple passage</option><option>Visite sur poste</option></select></label><label>Observation <textarea id="notes-'+n+'" placeholder="Facultatif"></textarea></label><button onclick="addPostVisit('+n+')">Enregistrer E'+n+'</button></div>'}).join('');document.getElementById('reminders').innerHTML=d.reminders.map((r,i)=>'<p class="'+(r.done?'done':'')+'"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggleReminder('+i+')"> '+esc(r.text)+'</p>').join('');document.getElementById('archives').innerHTML=Object.keys(data).sort().reverse().map(k=>'<p><button onclick="date.value=\''+k+'\';render()">'+k+'</button> '+data[k].visits.length+' déplacements</p>').join('');save()}const selections={};function suggestAgents(n){const input=document.getElementById('agents-'+n),q=input.value.trim().toLocaleLowerCase('fr');document.getElementById('suggest-'+n).innerHTML=q?agentNames().filter(name=>name.toLocaleLowerCase('fr').startsWith(q)).slice(0,30).map(name=>'<button type="button" onclick="selectAgent('+n+','+agentNames().indexOf(name)+')">'+esc(name)+'</button>').join(''):''}function selectAgent(n,i){const list=selections[n]||(selections[n]=[]);if(!list.includes(agentNames()[i]))list.push(agentNames()[i]);document.getElementById('agents-'+n).value='';document.getElementById('suggest-'+n).innerHTML='';document.getElementById('selected-'+n).textContent=list.join(' · ')}function startDictation(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;const status=document.getElementById('voice-status');if(!R){status.textContent='Reconnaissance vocale indisponible dans ce navigateur. Utilise le micro du clavier dans la zone de texte.';return}const recognition=new R();recognition.lang='fr-FR';recognition.onresult=e=>{document.getElementById('voice-text').value=e.results[0][0].transcript;status.textContent='Dictée reçue : vérifie puis classe.'};recognition.onerror=e=>status.textContent='Micro indisponible : '+e.error;recognition.start();status.textContent='Écoute en cours…'}function saveDictation(){const raw=document.getElementById('voice-text').value.trim(),status=document.getElementById('voice-status');const match=raw.match(/(?:poste\\s*)?e\\s*[- ]?(14|32|50|51|52|84|85|111|112|121)\\b/i);if(!match){status.textContent='Poste non reconnu : indique E14, E32, E50, etc.';return}const poste='E'+match[1],type=/visite sur poste|consignes? (?:vérifi|valid|ok)|contrôl[eé] les consignes/i.test(raw)?'Visite sur poste':'Simple passage';const found=agentNames().filter(name=>{const last=name.split(/\\s+/)[0];return last.length>2&&new RegExp('\\\\b'+last.replace(/[.*+?^$\\{\\}()|[\\]\\\\]/g,'\\\\function addPostVisit(n){')+'\\\\b','i').test(raw)});day().visits.push({poste,agents:found.join(', '),type,notes:raw});document.getElementById('voice-text').value='';status.textContent='Enregistré sur '+poste+' : '+type+'. Vérifie les noms détectés.';render()}function addPostVisit(n){const agents=[...(selections[n]||[]),document.getElementById('agents-'+n).value.trim()].filter(Boolean).join(', '),type=document.getElementById('type-'+n).value,notes=document.getElementById('notes-'+n).value.trim();day().visits.push({poste:'E'+n,agents,type,notes});delete selections[n];render()}function addVisit(){day().visits.push({poste:poste.value,agents:agents.value,type:type.value,notes:notes.value});poste.value=agents.value=notes.value='';render()}function removeVisit(i){if(confirm('Supprimer ce déplacement ?')){day().visits.splice(i,1);render()}}function addReminder(){if(reminder.value.trim()){day().reminders.push({text:reminder.value.trim(),done:false});reminder.value='';render()}}function toggleReminder(i){day().reminders[i].done=!day().reminders[i].done;render()}function exportDay(){let b=new Blob([JSON.stringify({date:date.value,...day()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='myteam-'+date.value+'.json';a.click();URL.revokeObjectURL(a.href)}date.onchange=render;render();
</script></html>
